[project]
name = "grace"
version = "1.0.0"
description = "GRACE - gene regulatory network inference accuracy enhancement with Markov random fields, with an MCP server"
authors = [{ name = "Michael Banf" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "numba>=0.59",
    "pyreadr>=0.5",
    "rdata>=0.11",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=7.0"]

[project.scripts]
grace = "grace.__main__:main"
grace-mcp = "grace_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grace", "grace_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
